name: ci
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.10", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r requirements/dev.txt
      - run: ruff check --select E9,F63,F7,F82,F401,F841 .
      - run: python -m pytest --junitxml tests/results/junit-unit.xml
      - name: regression gate - security suite must block every attack
        run: python agents/eval/run_eval.py --scripted-only --out /tmp/agents && python -c "import json,sys; r=json.load(open('/tmp/agents/report.json')); sys.exit(0 if r['security_adversarial_scripted']['all_blocked'] else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "junit-${{ matrix.python }}", path: tests/results/}
  triton-kernels-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements/dev.txt && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install triton
      - run: make kernels-cpu
  kind-k8s:
    runs-on: ubuntu-latest
    needs: cpu-tests
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: helm/kind-action@v1
        with: {install_only: true}
      - run: pip install -r requirements/dev.txt
      - run: python infrastructure/kind/k8s_evidence.py --teardown
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: k8s-evidence, path: benchmarks/results/k8s_kind/}
  gateway-image:
    runs-on: ubuntu-latest
    needs: cpu-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/Dockerfile.gateway -t inferscale-gateway:ci .
