apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  clusterIP: None
  selector: {app: {{ .Release.Name }}-vllm}
  ports: [{port: 8000, name: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  serviceName: {{ .Release.Name }}-vllm
  replicas: {{ .Values.vllm.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: {{ .Release.Name }}-vllm}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-vllm}
      {{- if .Values.monitoring.podAnnotations }}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
      {{- end }}
    spec:
      nodeSelector: {{- toYaml .Values.vllm.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.vllm.tolerations | nindent 8 }}
      containers:
        - name: vllm
          image: {{ .Values.vllm.image }}
          args:
            - --model={{ .Values.vllm.model }}
            - --port=8000
            - --gpu-memory-utilization={{ .Values.vllm.gpuMemoryUtilization }}
            - --max-model-len={{ .Values.vllm.maxModelLen }}
            - --tensor-parallel-size={{ .Values.vllm.gpusPerReplica }}
            {{- range .Values.vllm.extraArgs }}
            - {{ . }}
            {{- end }}
          resources:
            limits: {nvidia.com/gpu: {{ .Values.vllm.gpusPerReplica }}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 5}
          startupProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, failureThreshold: 90}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
  volumeClaimTemplates:
    - metadata: {name: hf-cache}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.vllm.cacheSize }}}}
